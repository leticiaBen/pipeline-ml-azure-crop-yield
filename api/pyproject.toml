# Configuration partagée entre le développement local et ci.yml, pour que
# « ça passe chez moi » et « ça passe en CI » veuillent dire la même chose.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
