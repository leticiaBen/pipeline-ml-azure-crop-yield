# =============================================================================
#  Intégration continue — section 4.6 de l'énoncé
#    lint (ruff), tests (pytest), construction et publication sur GHCR
#
#  Aucune ressource Azure n'est touchée ici : ce workflow tourne entièrement
#  sur les runners GitHub. Le déploiement vers Azure est dans deploy.yml.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Permissions minimales par défaut ; le job image élève packages: write.
permissions:
  contents: read

env:
  IMAGE_VERSION: "1.0.0"
  TAILLE_MAX_MO: "500"

jobs:
  # ---------------------------------------------------------------------------
  qualite:
    name: Lint et tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Dépendances
        run: pip install -r api/requirements-dev.txt

      - name: Lint — ruff sur api/ et model/
        run: ruff check .

      - name: Tests — pytest sur l'API
        working-directory: api
        # « python -m pytest » et non « pytest » : la forme -m ajoute le
        # dossier courant à sys.path, sans quoi « from main import app »
        # échoue dans les tests.
        run: python -m pytest -q

      - name: Dépendances des Functions
        run: pip install -r functions/requirements.txt pytest

      - name: Tests — pytest sur les Functions
        working-directory: functions
        # Teste la logique de validation et de lecture CSV sans le runtime
        # Functions : ce sont les fonctions qui decident d'accepter ou de
        # rejeter un fichier, donc celles ou une erreur coute le plus cher.
        run: python -m pytest tests -q

  # ---------------------------------------------------------------------------
  image:
    name: Image Docker
    needs: qualite
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Nom de l'image
        id: nom
        # GHCR n'accepte que des minuscules, or le compte s'écrit leticiaBen.
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/api" >> "$GITHUB_OUTPUT"

      - name: Connexion à GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Jeton fourni par GitHub, aucun secret à stocker.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construction
        uses: docker/build-push-action@v7
        with:
          context: .
          file: api/Dockerfile
          # load et non push : l'image reste locale au runner le temps des
          # contrôles ci-dessous. Elle n'est publiée qu'une fois validée.
          load: true
          tags: |
            ${{ steps.nom.outputs.image }}:${{ env.IMAGE_VERSION }}
            ${{ steps.nom.outputs.image }}:${{ github.sha }}
          # Trace le commit exact dans les metadonnees de l'image, en plus de
          # l'etiquette : une image recuperee du registre dit d'ou elle vient.
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Contrôle de la taille
        # L'énoncé impose une image sous 500 Mo. Le contrôle est automatisé :
        # une dépendance lourde ajoutée par mégarde fera échouer la CI au lieu
        # d'être découverte à la soutenance.
        #
        # Attention au chiffre que l'on mesure. « docker image inspect .Size »
        # renvoie la taille du contenu COMPRESSÉ (≈113 Mo ici) : un contrôle
        # fondé sur elle laisserait passer une image de 600 Mo décompressée.
        # On mesure donc le système de fichiers réel du conteneur, qui est la
        # grandeur exigeante, et on journalise les deux.
        env:
          IMG: ${{ steps.nom.outputs.image }}
        run: |
          compresse=$(( $(docker image inspect "$IMG:$IMAGE_VERSION" --format '{{.Size}}') / 1000000 ))
          reel=$(docker run --rm --entrypoint sh "$IMG:$IMAGE_VERSION" \
                   -c "du -sm --exclude=/proc --exclude=/sys --exclude=/dev / 2>/dev/null | cut -f1")
          echo "Système de fichiers du conteneur : ${reel} Mo"
          echo "Contenu compressé, poussé au registre : ${compresse} Mo"
          echo "Limite de l'énoncé : ${TAILLE_MAX_MO} Mo"
          {
            echo "### Taille de l'image"
            echo "| Mesure | Valeur |"
            echo "|---|---|"
            echo "| Système de fichiers du conteneur | ${reel} Mo |"
            echo "| Compressée (registre) | ${compresse} Mo |"
            echo "| Limite de l'énoncé | ${TAILLE_MAX_MO} Mo |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$reel" -ge "$TAILLE_MAX_MO" ]; then
            echo "::error::Le système de fichiers de l'image fait ${reel} Mo, limite ${TAILLE_MAX_MO} Mo"
            exit 1
          fi

      - name: Contrôle de l'utilisateur non root
        env:
          IMG: ${{ steps.nom.outputs.image }}
        run: |
          uid=$(docker run --rm --entrypoint id "$IMG:$IMAGE_VERSION" -u)
          echo "uid dans le conteneur : $uid"
          if [ "$uid" = "0" ]; then
            echo "::error::Le conteneur tourne en root"
            exit 1
          fi

      - name: Contrôle des labels OCI
        # Le label source est ce qui relie le paquet au depot sur GHCR.
        # S'il disparaissait, le paquet redeviendrait orphelin sans que
        # personne ne s'en apercoive.
        env:
          IMG: ${{ steps.nom.outputs.image }}
        run: |
          source=$(docker image inspect "$IMG:$IMAGE_VERSION" \
                     --format '{{ index .Config.Labels "org.opencontainers.image.source" }}')
          revision=$(docker image inspect "$IMG:$IMAGE_VERSION" \
                     --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          echo "source   : $source"
          echo "revision : $revision"
          attendu="https://github.com/${{ github.repository }}"
          if [ "$source" != "$attendu" ]; then
            echo "::error::label source absent ou incorrect (attendu $attendu)"
            exit 1
          fi
          if [ "$revision" != "${{ github.sha }}" ]; then
            echo "::error::label revision incorrect (attendu ${{ github.sha }})"
            exit 1
          fi

      - name: Test de fumée — le conteneur sert vraiment
        env:
          IMG: ${{ steps.nom.outputs.image }}
        run: |
          docker run -d --name fumee -p 8000:8000 "$IMG:$IMAGE_VERSION"
          # --retry-all-errors : le proxy accepte la connexion puis la coupe
          # tant que l'API n'écoute pas, donc --retry-connrefused ne suffit pas.
          curl -sS --retry 60 --retry-delay 1 --retry-all-errors --retry-connrefused \
               -m 5 -o /dev/null -w 'health: HTTP %{http_code}\n' \
               http://127.0.0.1:8000/health

          echo "--- /predict doit répondre 200 ---"
          code=$(curl -s -o /tmp/p.json -w '%{http_code}' -X POST http://127.0.0.1:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"Area":"France","Item":"Potatoes","Year":2012,
                 "average_rain_fall_mm_per_year":867,"pesticides_tonnes":72000,"avg_temp":11.2}')
          cat /tmp/p.json; echo
          [ "$code" = "200" ] || { echo "::error::/predict a renvoyé $code"; docker logs fumee; exit 1; }

          echo "--- la pluviométrie négative doit répondre 422 ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"Area":"France","Item":"Potatoes","Year":2012,
                 "average_rain_fall_mm_per_year":-500,"pesticides_tonnes":72000,"avg_temp":11.2}')
          echo "pluie négative : HTTP $code"
          [ "$code" = "422" ] || { echo "::error::attendu 422, obtenu $code"; exit 1; }

          docker rm -f fumee

      - name: Publication sur GHCR
        # Seulement sur push vers main : une pull request venant d'un fork
        # n'a pas le droit d'écrire dans le registre, et n'en a pas besoin.
        if: github.event_name == 'push'
        env:
          IMG: ${{ steps.nom.outputs.image }}
        run: |
          docker push "$IMG:$IMAGE_VERSION"
          docker push "$IMG:${{ github.sha }}"
          echo "### Image publiée" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$IMG:$IMAGE_VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`$IMG:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
