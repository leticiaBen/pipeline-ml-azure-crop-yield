# =============================================================================
#  Deploiement en production — section 4.6 de l'enonce
#
#  Connexion a Azure par OIDC avec l'identite manageee attribuee par
#  l'utilisateur : aucun mot de passe, aucune cle, aucun secret Azure.
#  Les trois secrets utilises sont des identifiants non sensibles, portes par
#  l'environnement « production » et non par le depot.
#
#  Declenche APRES la CI et non sur le push : l'image etiquetee avec le SHA
#  du commit doit exister sur GHCR avant qu'on demande a Container Apps de la
#  tirer. Deux workflows sur le meme push s'executeraient en parallele, et le
#  deploiement perdrait la course.
#
#  DEUX JOBS, et c'est voulu. Le job « decider » determine si quelque chose de
#  deployable a change. Le job « deploy », qui porte l'environnement
#  production, n'est alors meme pas cree pour un commit de documentation :
#  aucune demande d'approbation ne part, et l'equipe n'est pas sollicitee pour
#  une correction de faute dans un README.
# =============================================================================
name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Declenchement manuel : utile pour redeployer un commit precis, ou forcer
  # un deploiement que le filtre aurait ecarte.
  workflow_dispatch:
    inputs:
      sha:
        description: "SHA complet du commit a deployer (vide = HEAD)"
        required: false
        type: string

permissions:
  contents: read

env:
  RG: rg-projet-cropyield
  APP: api-cropyield
  FUNC: func-cropyield
  IMAGE: ghcr.io/leticiaben/pipeline-ml-azure-crop-yield/api
  API_URL: https://api-cropyield.calmmoss-a33fdd9d.francecentral.azurecontainerapps.io

jobs:
  # ===========================================================================
  decider:
    name: Faut-il deployer ?
    # Ne rien faire si la CI a echoue : inutile de deployer une image dont les
    # tests ne sont pas passes.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.cible.outputs.sha }}
      deployer: ${{ steps.filtre.outputs.deployer }}
    steps:
      - name: Commit a deployer
        id: cible
        # Sur un evenement workflow_run, github.sha designe la pointe de la
        # branche par defaut, PAS le commit qui a declenche la CI. Il faut
        # lire head_sha, sinon on deploierait la mauvaise image.
        run: |
          sha="${{ github.event.workflow_run.head_sha }}"
          if [ -z "$sha" ]; then sha="${{ inputs.sha }}"; fi
          if [ -z "$sha" ]; then sha="${{ github.sha }}"; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Commit cible : $sha"

      - name: Recuperation du code
        # « ref » est obligatoire, pour la meme raison que head_sha ci-dessus :
        # actions/checkout recupere par defaut la pointe de la branche.
        # fetch-depth 2 donne acces au commit parent, necessaire au diff.
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.cible.outputs.sha }}
          fetch-depth: 2

      - name: Quelque chose de deployable a-t-il change ?
        id: filtre
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Declenchement manuel : on deploie sans filtrer."
            echo "deployer=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! git rev-parse "HEAD^" >/dev/null 2>&1; then
            echo "Commit parent inaccessible : on deploie par prudence."
            echo "deployer=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          modifies=$(git diff --name-only HEAD^ HEAD)
          echo "Fichiers modifies :"; echo "$modifies" | sed 's/^/  /'

          # Un fichier Markdown sous api/ ou model/ ne change pas l'image :
          # le .dockerignore exclut *.md du contexte de construction.
          pertinents=$(printf '%s\n' "$modifies" \
            | grep -E '^(api/|model/|functions/|\.github/workflows/deploy\.yml$)' \
            | grep -vE '\.md$' || true)

          if [ -n "$pertinents" ]; then
            echo "deployer=true" >> "$GITHUB_OUTPUT"
            { echo "### Deploiement declenche"; echo "Fichiers deployables modifies :";
              printf '%s\n' "$pertinents" | sed 's/^/- `/; s/$/`/'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "deployer=false" >> "$GITHUB_OUTPUT"
            { echo "### Deploiement ignore";
              echo "Aucun fichier de \`api/\`, \`model/\` ou \`functions/\` n'a change.";
              echo "La production sert donc toujours un commit anterieur, et c'est normal.";
              echo "Pour forcer : declenchement manuel de ce workflow."; } >> "$GITHUB_STEP_SUMMARY"
          fi

  # ===========================================================================
  deploy:
    name: Mise a jour de l'API en production
    needs: decider
    # Si rien de deployable n'a change, ce job n'existe pas : aucune
    # approbation n'est demandee a l'equipe.
    if: needs.decider.outputs.deployer == 'true'
    runs-on: ubuntu-latest

    # Deux roles, et c'est le coeur de la section 4.6 :
    #   1. porte d'approbation manuelle, avec 5 relecteurs obligatoires
    #   2. contexte du sujet federe OIDC. Sans cette ligne, azure/login
    #      echoue sur AADSTS700213.
    environment:
      name: production
      url: https://api-cropyield.calmmoss-a33fdd9d.francecentral.azurecontainerapps.io

    permissions:
      id-token: write    # obligatoire pour recevoir le jeton OIDC
      contents: read

    env:
      SHA: ${{ needs.decider.outputs.sha }}

    steps:
      - name: Recuperation du code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.decider.outputs.sha }}

      - name: L'image existe-t-elle sur GHCR ?
        # « docker manifest inspect » plutot qu'une requete curl a la main :
        # l'outil negocie lui-meme les types de manifeste. Une premiere
        # version interrogeait le registre avec un en-tete Accept incomplet et
        # recevait un 404 trompeur — GHCR repond 404, et non 406, quand
        # l'en-tete ne couvre pas le type exact du manifeste.
        run: |
          if docker manifest inspect "${IMAGE}:${SHA}" > /dev/null 2>&1; then
            echo "Image presente sur GHCR : ${IMAGE}:${SHA}"
          else
            echo "::error::image introuvable sur GHCR pour ${SHA}"
            exit 1
          fi

      - name: Connexion a Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Mise a jour de Container Apps
        # GIT_SHA est pose en meme temps que l'image : c'est ce qui rend le
        # deploiement verifiable par GET /version.
        run: |
          az containerapp update -n "$APP" -g "$RG" \
            --image "${IMAGE}:${SHA}" \
            --set-env-vars "GIT_SHA=${SHA}" \
            -o none
          echo "Revision active :"
          az containerapp revision list -n "$APP" -g "$RG" \
            --query "[?properties.active].{nom:name, image:properties.template.containers[0].image, replicas:properties.replicas}" \
            -o table

      - name: Verification — GET /version renvoie le bon commit
        # C'est le « Termine quand » de la section 4.6.
        run: |
          for i in $(seq 1 30); do
            vu=$(curl -s --max-time 30 "$API_URL/version" \
                 | python3 -c 'import sys,json; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || true)
            echo "tentative $i : commit vu = ${vu:-aucune reponse}"
            [ "$vu" = "$SHA" ] && break
            curl -s -o /dev/null --max-time 10 "$API_URL/health" || true
          done
          [ "$vu" = "$SHA" ] || { echo "::error::l'API sert encore $vu au lieu de $SHA"; exit 1; }
          {
            echo "### Deploiement en production"
            echo "| | |"; echo "|---|---|"
            echo "| Commit | \`$SHA\` |"
            echo "| Image | \`${IMAGE}:${SHA}\` |"
            echo "| URL | $API_URL |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fumee de l'API
        run: |
          code=$(curl -s -o /tmp/p.json -w '%{http_code}' --max-time 30 -X POST "$API_URL/predict" \
            -H 'Content-Type: application/json' \
            -d '{"Area":"France","Item":"Potatoes","Year":2012,
                 "average_rain_fall_mm_per_year":867,"pesticides_tonnes":72000,"avg_temp":11.2}')
          cat /tmp/p.json; echo
          [ "$code" = "200" ] || { echo "::error::/predict a renvoye $code"; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -X POST "$API_URL/predict" \
            -H 'Content-Type: application/json' \
            -d '{"Area":"France","Item":"Potatoes","Year":2012,
                 "average_rain_fall_mm_per_year":-500,"pesticides_tonnes":72000,"avg_temp":11.2}')
          echo "pluie negative : HTTP $code"
          [ "$code" = "422" ] || { echo "::error::attendu 422, obtenu $code"; exit 1; }

      # ---------------------------------------------------------------------
      #  Function App — l'enonce demande « mise a jour de Container Apps, puis
      #  deploiement de la Function App ».
      # ---------------------------------------------------------------------
      - name: Construction du paquet des Functions
        run: |
          vu=$(git rev-parse HEAD)
          echo "commit recupere : $vu"
          [ "$vu" = "$SHA" ] || { echo "::error::checkout sur $vu au lieu de $SHA"; exit 1; }

          rm -rf /tmp/funcpkg /tmp/func.zip
          mkdir -p /tmp/funcpkg
          # Seuls ces trois fichiers : ni tests, ni .venv, ni local.settings.json.
          cp functions/function_app.py functions/host.json functions/requirements.txt /tmp/funcpkg/
          (cd /tmp/funcpkg && zip -q -r /tmp/func.zip .)
          unzip -l /tmp/func.zip

      - name: Deploiement de la Function App
        # --build-remote : les dependances sont installees cote Azure. Le
        # paquet construit pese ~13 Mo pour 6 Ko de source.
        run: |
          az functionapp deployment source config-zip \
            -n "$FUNC" -g "$RG" --src /tmp/func.zip --build-remote true -o none
          echo "Paquet deploye"

      - name: Verification — les trois fonctions sont indexees
        # Ce controle n'est pas du zele. Un deploiement peut reussir et laisser
        # « 0 functions loaded » : c'est arrive avec un parametre mal nomme, et
        # RIEN dans les logs de deploiement ne le signalait. Seul Application
        # Insights portait la cause.
        run: |
          attendues="dispatcher recent worker"
          manque=1
          for i in $(seq 1 24); do
            liste=$(az functionapp function list -n "$FUNC" -g "$RG" \
                      --query "[].name" -o tsv | sed 's|.*/||' | sort | tr '\n' ' ')
            echo "tentative $i : [$liste]"
            manque=0
            for f in $attendues; do
              case " $liste " in *" $f "*) ;; *) manque=1 ;; esac
            done
            [ "$manque" = "0" ] && break
            sleep 10
          done
          if [ "$manque" != "0" ]; then
            echo "::error::indexation incomplete, fonctions vues : [$liste]"
            echo "::error::chercher la cause dans Application Insights :"
            echo "::error::  traces | where message has 'FunctionLoadError'"
            exit 1
          fi
          echo "Les trois fonctions sont indexees"
          { echo "### Function App"; echo "- fonctions indexees : \`$liste\`"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Fumee des Functions — /api/recent repond
        run: |
          code=$(curl -s -o /tmp/recent.json -w '%{http_code}' --max-time 60 \
            "https://$FUNC.azurewebsites.net/api/recent")
          echo "api/recent : HTTP $code"
          head -c 400 /tmp/recent.json; echo
          [ "$code" = "200" ] || { echo "::error::/api/recent a renvoye $code"; exit 1; }
